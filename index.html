<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровая визитка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #121214;
            color: #e1e1e6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #202024;
            width: 350px;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #00b37e;
        }
        h1 {
            font-size: 22px;
            color: #f3f3f5;
            margin-bottom: 5px;
        }
        .role {
            font-size: 14px;
            color: #00b37e;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            background: #00b37e;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #00875f;
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Фото">
        <h1>Анна Смирнова</h1>
        <p class="role">Frontend Developer</p>
        <a href="#" class="btn">Написать в Telegram</a>
        <a href="#" class="btn">Портфолио на GitHub</a>
    </div>

</body>
</html>
